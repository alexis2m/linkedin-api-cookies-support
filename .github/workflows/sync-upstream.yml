name: Sync fork with upstream

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream changes into main
        run: gh api -X POST "repos/${{ github.repository }}/merge-upstream" -f branch=main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
